stages:
  - test
  - audit
  - build
  - upload
  - release

variables:
  BUILD_IMAGE: ${ARTIFACTORY_SERVER}/sds/sdd-common-ci:mr-55
  DEFAULT_IMAGE: ${ARTIFACTORY_SERVER}/docker:28-cli

# Release process
include:
  - project: "sds-dev/releases"
    ref: main
    file: "releases.yml"

#
# Code testing
#
.test-base:
  stage: test
  tags:
    - sds-test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  image: $BUILD_IMAGE
  before_script:
    - pnpm install

code-style:
  extends: .test-base
  script:
    - pnpm run lint:check

format-style:
  extends: .test-base
  script:
    - pnpm run format:check

type-check:
  extends: .test-base
  script:
    - pnpm run tsc

unittest:
  extends: .test-base
  script:
    - pnpm run test:coverage

#
# JFrog audit for pnpm
#
jfrog-pnpm-audit:
  stage: audit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  image: $BUILD_IMAGE
  tags:
    - sds-test
  before_script:
    - jf config import "${JF_CONFIG_READ_ONLY}"
  script:
    - jf audit --pnpm --licenses --extended-table --watches=sds-watch

#
# Docker image build, scan and push pipeline
#
1-build-image:
  stage: build
  image: $DEFAULT_IMAGE
  tags:
    - sds-build
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      variables:
        IMAGE_TAG: $CI_DEFAULT_BRANCH_SLUG
    - if: "$CI_COMMIT_TAG"
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        IMAGE_TAG: $CI_COMMIT_REF_SLUG
  before_script:
    - echo "registry=${ARTIFACTORY_NPM_REGISTRY}" >> .npmrc
    - echo "@jsr:registry=${ARTIFACTORY_NPM_REGISTRY}" >> .npmrc
    - echo "${ARTIFACTORY_NPM_REGISTRY#https:}:_authToken=${ARTIFACTORY_NPM_TOKEN}" >> .npmrc
  script:
    - echo "Building image sd-submit-ui:${IMAGE_TAG}"
    - docker buildx build -t "${CONTAINER_REGISTRY_ADDRESS}/sds/sd-submit-ui:${IMAGE_TAG}" -f Dockerfile .
    - docker push "${CONTAINER_REGISTRY_ADDRESS}/sds/sd-submit-ui:${IMAGE_TAG}"

2-scan-image:
  stage: build
  image: $BUILD_IMAGE
  tags:
    - sds-build
  needs:
    - job: 1-build-image
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      variables:
        IMAGE_TAG: $CI_DEFAULT_BRANCH_SLUG
    - if: "$CI_COMMIT_TAG"
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        IMAGE_TAG: $CI_COMMIT_REF_SLUG
  before_script:
    - jf config import "${JF_CONFIG_READ_ONLY}"
  script:
    - docker pull "${CONTAINER_REGISTRY_ADDRESS}/sds/sd-submit-ui:${IMAGE_TAG}"
    - jf docker scan --licenses --extended-table --watches=sds-watch "${CONTAINER_REGISTRY_ADDRESS}/sds/sd-submit-ui:${IMAGE_TAG}"

1-upload-image:
  stage: upload
  image: $DEFAULT_IMAGE
  tags:
    - sds-upload
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: never
    - if: "$CI_COMMIT_TAG"
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
      variables:
        IMAGE_TAG: $CI_COMMIT_REF_SLUG
  before_script:
    - jf config import "${JF_CONFIG}"
  variables:
    REGISTRY_IMAGE: ${CONTAINER_REGISTRY_ADDRESS}/sds/sd-submit-ui:${IMAGE_TAG}
  script:
    # Push to Artifactory, retry a few times if pushing fails
    - echo "Pushing image sd-submit-ui:${IMAGE_TAG}"
    - docker pull "${REGISTRY_IMAGE}"
    - docker tag "${REGISTRY_IMAGE}" "${ARTIFACTORY_SERVER}/${REGISTRY_IMAGE#*/}"
    - jf docker push "${ARTIFACTORY_SERVER}/${REGISTRY_IMAGE#*/}"

release-job:
  extends: .automated-release
  release:
    description: $(cat release_changes.md)
